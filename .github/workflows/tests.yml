name: Tests

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main

jobs:
  ruby_test:
    name: Ruby Test Action
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        ruby:
          - '2.7'
          - '3.0'
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'
          - jruby-9.4
          - truffleruby
        rails:
          - '6.1'
          - '7.0'
          - '7.1'
          - '8.0'
        exclude:
          - os: windows-latest
            ruby: jruby
          - os: windows-latest
            ruby: truffleruby
          - rails: '6.1'
            ruby: '3.4'
          - rails: '7.0'
            ruby: '3.4'
          - rails: '7.1'
            ruby: jruby
          - rails: '7.1'
            ruby: truffleruby
          - rails: '8.0'
            ruby: '2.7'
          - rails: '8.0'
            ruby: '3.0'
          - rails: '8.0'
            ruby: '3.1'
          - rails: '8.0'
            ruby: jruby
          - rails: '8.0'
            ruby: truffleruby
    steps:
      - uses: actions/checkout@v3
      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        env:
          RAILS_VERSION: ${{ matrix.rails }}
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run ruby tests
        env:
          RAILS_VERSION: ${{ matrix.rails }}
        run: bundle exec rake test
