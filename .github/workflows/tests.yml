name: Tests

on: [push, pull_request]

jobs:
  ruby_test:
    name: "Test ruby:${{matrix.ruby}} rails:${{matrix.rails}} ${{matrix.os}}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          #- macos-latest
          #- windows-latest
        ruby:
          - '2.7'
          - '3.0'
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'
          #- jruby-9.4
          #- truffleruby
        rails:
          - '6.0.6.1'
          - '6.1.7.10'
          - '7.0.8.7'
          - '7.1.5.1'
          - '7.2.2.1'
          - '8.0.2'
        exclude:
          - os: windows-latest
            ruby: jruby
          - os: windows-latest
            ruby: truffleruby
          - rails: '6.0.6.1'
            ruby: '3.4'
          - rails: '6.1.7.10'
            ruby: '3.4'
          - rails: '7.0.8.7'
            ruby: '3.4'
          - rails: '7.2.2.1'
            ruby: '2.7'
          - rails: '7.2.2.1'
            ruby: '3.0'
          - rails: '8.0.2'
            ruby: '2.7'
          - rails: '8.0.2'
            ruby: '3.0'
          - rails: '8.0.2'
            ruby: '3.1'
    steps:
      - uses: actions/checkout@v3
      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        env:
          RAILS_VERSION: ${{ matrix.rails }}
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run ruby tests
        env:
          RAILS_VERSION: ${{ matrix.rails }}
        run: bundle exec rake test
