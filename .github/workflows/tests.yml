name: Tests

on: [push, pull_request]

jobs:
  ruby_test:
    name: Ruby Test Action
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        ruby-version:
          - '2.7'
          - '3.0'
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'
          - jruby-9.4
          - truffleruby
        rails-version:
          - '6.0'
          - '6.1'
          - '7.0'
          - '7.1'
          - '7.2'
          - '8.0'
        exclude:
          - os: windows-latest
            ruby-version: jruby
          - os: windows-latest
            ruby-version: truffleruby
          - rails-version: '6.0'
            ruby-version: '3.4'
          - rails-version: '6.1'
            ruby-version: '3.4'
          - rails-version: '7.0'
            ruby-version: '3.4'
          # - rails: '7.1'
          #   ruby: jruby
          # - rails: '7.1'
          #   ruby: truffleruby
          - rails-version: '8.0'
            ruby-version: '2.7'
          - rails-version: '8.0'
            ruby-version: '3.0'
          - rails-version: '8.0'
            ruby-version: '3.1'
          # - rails: '8.0'
          #   ruby: jruby
          # - rails: '8.0'
          #   ruby: truffleruby
    steps:
      - uses: actions/checkout@v3
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        env:
          RAILS_VERSION: ${{ matrix.rails-version }}
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run ruby tests
        env:
          RAILS_VERSION: ${{ matrix.rails-version }}
        run: bundle exec rake test
